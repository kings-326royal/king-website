name: Update citation metrics

on:
  schedule:
    - cron: "30 2 * * 1"   # Mondays 08:00 IST
  push:
    branches: [main]
    paths: [data.js]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch metrics
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
        run: python3 scripts/update_metrics.py

      - name: Commit metrics.js if changed
        run: |
          if git diff --quiet -- metrics.js; then
            echo "No change in metrics.js"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add metrics.js
          git commit -m "Update citation metrics"
          git pull --rebase origin main
          git push origin HEAD:main
